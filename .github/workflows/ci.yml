name: ahko CI Gate

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Install Dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Run Tests
      run: npm test

    - name: Build JS & Types
      run: npm run build

    - name: Test packed npm package
      run: npm run test:package

    - name: Run Examples Suite
      run: npm run test:examples
